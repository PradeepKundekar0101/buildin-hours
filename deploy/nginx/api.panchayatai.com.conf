upstream orchestrator {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.panchayatai.com;

    location / {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;

        # Required for the Twilio media-stream socket at /media/:callId.
        # Everything else on this app is plain HTTP, but Connection/Upgrade
        # are only sent by clients that actually asked to upgrade, so this
        # is safe to apply unconditionally.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# certbot --nginx will append the listen 443 ssl / ssl_certificate lines to
# the server block above (or add a second one) on first run - do not
# pre-author the TLS block by hand.
